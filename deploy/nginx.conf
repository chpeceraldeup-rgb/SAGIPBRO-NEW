# Replace upstream addresses and certificate paths for the deployment.
# Keep PHP backends reachable only from this balancer or the private network.
upstream sagipbro_php {
    least_conn;
    server 127.0.0.1:8081 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name sagipbro.example.org;
    return 301 https://sagipbro.example.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sagipbro.example.org;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/sagipbro-access.log;
    error_log /var/log/nginx/sagipbro-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location ~ (^/\.|^/(config|database|tests|java|deploy)/|^/actions/auth/setup_admin\.php$) {
        return 404;
    }

    location / {
        proxy_pass http://sagipbro_php;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
